# 统一人工选文源（48 篇）
#
# 本文件是 build_papers.py 与 verify_papers.py 的唯一选文来源，替代两处
# 曾经硬编码的选文清单（build_papers.py 的 STRUCTURE 与 verify_papers.py 的
# CANDICATES）。每篇包含 id、expected_title（规范标题；已知 LaTeX/标点/前缀
# 差异由 paper_validation.TITLE_ALIASES 的逐 ID 显式表处理）、topics（仅主线
# 条目）与 related 顺序（仅主线条目）。
#
# 条目顺序与 verify_papers.py 曾使用的 CANDICATES 顺序一致（逐条 top-level 及其
# related），因此缓存顺序、生成顺序与已有 papers.yml / verified-metadata.json 保持
# 字节一致。主线 13 篇（带 topics/related）+ 关联 35 篇（不带）= 48 篇。
#
# 维护规则：增减条目或改动分组必须同步更新 papers.yml（经 build_papers.py 重新
# 生成），并重新核验 13/35/48 计数与分组一致性。本文件由人工维护，不自动
# 从网络导入。

